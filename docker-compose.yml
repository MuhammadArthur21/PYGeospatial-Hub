# PyGeospatial Hub - Main Docker Compose
# Orchestrates all services: Backend, PostgreSQL + PostGIS, Redis, MinIO

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pygeo-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://pygeo:pygeo_password@db:5432/pygeospatial_hub
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=pygeo_access
      - MINIO_SECRET_KEY=pygeo_secret
      - MINIO_BUCKET=pygeospatial-datasets
      - SECRET_KEY=pygeo-dev-secret-key-change-in-production
      - JWT_SECRET_KEY=pygeo-jwt-secret-change-in-production
      - DEBUG=true
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
    volumes:
      - ./backend:/app
    restart: unless-stopped

  db:
    image: postgis/postgis:16-3.4
    container_name: pygeo-postgis
    environment:
      - POSTGRES_USER=pygeo
      - POSTGRES_PASSWORD=pygeo_password
      - POSTGRES_DB=pygeospatial_hub
    ports:
      - "5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pygeo -d pygeospatial_hub"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: pygeo-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: pygeo-minio
    environment:
      - MINIO_ROOT_USER=pygeo_access
      - MINIO_ROOT_PASSWORD=pygeo_secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped

volumes:
  postgis_data:
  redis_data:
  minio_data:
